name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read

# 동시에 하나의 배포만 허용
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify-server:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test and build API
        run: ./scripts/verify-server.sh

  verify-production-api:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout compatibility contract
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify production API compatibility
        shell: bash
        run: |
          set -euo pipefail

          config_values="$(python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          config = json.loads(Path("Assets/Resources/OnlyMyGameConfig.json").read_text(encoding="utf-8"))
          api_base_url = config.get("apiBaseUrl")
          api_version = config.get("schemaVersion")
          compatibility_version = config.get("compatibilityVersion")
          if not isinstance(api_base_url, str) or not api_base_url:
              raise SystemExit("OnlyMyGameConfig.json requires a non-empty apiBaseUrl")
          if not isinstance(api_version, str) or not api_version:
              raise SystemExit("OnlyMyGameConfig.json requires a non-empty schemaVersion")
          if not isinstance(compatibility_version, str) or not compatibility_version:
              raise SystemExit("OnlyMyGameConfig.json requires a non-empty compatibilityVersion")
          parsed = urlsplit(api_base_url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit("Production apiBaseUrl must be an HTTPS origin without credentials")
          if parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("Production apiBaseUrl must not contain a path, query, or fragment")
          print(f"{api_base_url.rstrip('/')}\t{api_version}\t{compatibility_version}")
          PY
          )"
          IFS=$'\t' read -r api_base_url expected_api_version expected_compatibility_version <<< "$config_values"
          source_api_version="$(sed -nE 's/^[[:space:]]*public const string ApiVersion = "([^"]+)";.*/\1/p' Server/OnlyMyGame.Api/ApiPolicies.cs)"
          source_compatibility_version="$(sed -nE 's/^[[:space:]]*public const string RuleCompatibilityVersion = "([^"]+)";.*/\1/p' Server/OnlyMyGame.Api/ApiPolicies.cs)"
          if [ -z "$source_api_version" ] || [ -z "$source_compatibility_version" ]; then
            echo "Could not read API compatibility constants from ApiPolicies.cs." >&2
            exit 1
          fi
          if [ "$expected_api_version" != "$source_api_version" ]; then
            echo "OnlyMyGameConfig.json schemaVersion does not match ApiPolicies.cs." >&2
            exit 1
          fi
          if [ "$expected_compatibility_version" != "$source_compatibility_version" ]; then
            echo "OnlyMyGameConfig.json compatibilityVersion does not match ApiPolicies.cs." >&2
            exit 1
          fi

          health_json="$(curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 20 \
            --retry 3 --retry-delay 2 --retry-connrefused \
            "$api_base_url/health")"
          printf '%s' "$health_json" | python3 -c '
          import json, sys
          expected_api, expected_compatibility = sys.argv[1:]
          health = json.load(sys.stdin)
          actual = (health.get("status"), health.get("apiVersion"), health.get("compatibilityVersion"))
          expected = ("ok", expected_api, expected_compatibility)
          if actual != expected:
              raise SystemExit(f"Production API compatibility mismatch: expected {expected}, got {actual}")
          print(f"Production API is compatible: api={actual[1]}, rules={actual[2]}")
          ' "$expected_api_version" "$expected_compatibility_version"

  build:
    needs: [verify-server, verify-production-api]
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    timeout-minutes: 60
    steps:
      # 1. 저장소 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      # 2. Unity 라이브러리 캐시
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          # Unity Library는 서로 다른 Unity/패키지 조합과 호환되지 않는다.
          # restore-keys로 이전 캐시를 복원하면 UnityLinker가 오래된 어셈블리를
          # 로드해 빌드가 실패할 수 있으므로 정확히 일치하는 키만 사용한다.
          key: Library-WebGL-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      # 3. Node.js 설치 (unity-activate 사용을 위해 - Windows만 해당)
      - name: Setup Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 4. unity-activate 설치 (Windows만 해당)
      - name: Install unity-activate
        if: runner.os == 'Windows'
        run: npm install -g unity-activate

      # 5. ProjectVersion.txt에서 Unity 에디터 버전 읽기
      - name: Read Unity version from ProjectVersion
        shell: bash
        run: |
          UNITY_VERSION=$(awk -F': ' '/^m_EditorVersion:/ {print $2}' ProjectSettings/ProjectVersion.txt | tr -d '\r')
          if [ -z "$UNITY_VERSION" ]; then
            echo "ProjectSettings/ProjectVersion.txt 에서 m_EditorVersion 을 읽을 수 없습니다."
            exit 1
          fi

          echo "UNITY_VERSION=$UNITY_VERSION" >> "$GITHUB_ENV"
          echo "Project Unity version: $UNITY_VERSION"

      # 6. Unity 라이센스 활성화 (Windows - PowerShell)
      - name: Activate Unity License (Windows)
        if: runner.os == 'Windows'
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          UNITY_PATH: ${{ vars.UNITY_PATH }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # Unity 설치 경로 찾기
          $unityPath = $env:UNITY_PATH
          $unityVersion = $env:UNITY_VERSION
          
          if (-not $unityPath) {
            # ProjectVersion.txt 버전 우선 사용
            if ($unityVersion) {
              $versionedPath = "C:\Program Files\Unity\Hub\Editor\$unityVersion\Editor\Unity.exe"
              if (Test-Path $versionedPath) {
                $unityPath = $versionedPath
              }
            }

            # Unity Hub에서 자동 검색
            $hubPath = "C:\Program Files\Unity\Hub\Editor"
            if ((-not $unityPath) -and (Test-Path $hubPath)) {
              $unityPath = Get-ChildItem -Path $hubPath -Directory | 
                           Where-Object { $_.Name -match "^\d+\.\d+\.\d+f\d+" } | 
                           Sort-Object Name -Descending | 
                           Select-Object -First 1 | 
                           ForEach-Object { Join-Path $_.FullName "Editor\Unity.exe" }
            }
            
            # 대체 경로 확인
            if (-not $unityPath -or -not (Test-Path $unityPath)) {
              $altPaths = @(
                "D:\UnityEditor\$unityVersion\Editor\Unity.exe",
                "D:\Program Files\Unity\Hub\Editor\*\Editor\Unity.exe",
                "C:\Program Files\Unity\Editor\Unity.exe"
              )
              foreach ($path in $altPaths) {
                if ($path -like "*\*\*") {
                  $found = Get-ChildItem -Path $path -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($found) {
                    $unityPath = $found.FullName
                    break
                  }
                } elseif (Test-Path $path) {
                  $unityPath = $path
                  break
                }
              }
            }
          }
          
          if (-not $unityPath -or -not (Test-Path $unityPath)) {
            Write-Error "Unity를 찾을 수 없습니다. UNITY_PATH 환경변수를 설정하거나 Unity를 설치해주세요."
            exit 1
          }
          
          Write-Host "Unity 경로: $unityPath"
          
          # Unity 이메일 및 패스워드 확인
          $unityEmail = $env:UNITY_EMAIL
          $unityPassword = $env:UNITY_PASSWORD
          
          if ($unityEmail -and $unityPassword) {
            Write-Host "Unity 라이센스를 EMAIL/PASSWORD로 활성화합니다..."
            
            # Unity 라이센스 파일 경로 (Windows)
            $licensePath = "$env:ProgramData\Unity\Unity_lic.ulf"
            $licenseDir = Split-Path $licensePath -Parent
            
            # 디렉토리가 없으면 생성
            if (-not (Test-Path $licenseDir)) {
              New-Item -Path $licenseDir -ItemType Directory -Force | Out-Null
            }
            
            # ALF 파일 생성 (Manual Activation File)
            $alfFile = Join-Path $PWD.Path "Unity.alf"
            Write-Host "ALF 파일 생성 중: $alfFile"
            
            $process = Start-Process -FilePath $unityPath `
              -ArgumentList "-batchmode", "-nographics", "-quit", "-createManualActivationFile", "-logFile", "-" `
              -Wait -PassThru -NoNewWindow
            
            if (-not (Test-Path $alfFile)) {
              Write-Error "ALF 파일 생성 실패 (Exit Code: $($process.ExitCode))"
              exit 1
            }
            
            Write-Host "ALF 파일이 생성되었습니다: $alfFile"
            
            # unity-activate를 사용하여 라이센스 활성화
            Write-Host "unity-activate를 사용하여 라이센스 활성화 중..."
            
            # unity-activate 실행 (PATH에서 직접 실행)
            try {
              & unity-activate --username $unityEmail --password $unityPassword --out $licenseDir $alfFile
              
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Unity 라이센스 활성화 실패 (Exit Code: $LASTEXITCODE)"
                exit $LASTEXITCODE
              }
            } catch {
              Write-Error "Unity 라이센스 활성화 실패: $_"
              exit 1
            }
            
            Write-Host "Unity 라이센스가 활성화되었습니다: $licensePath"
          } else {
            Write-Host "UNITY_EMAIL 또는 UNITY_PASSWORD 시크릿이 설정되지 않았습니다. 기존 라이센스를 사용합니다."
            Write-Host "참고: Self-hosted runner에서 Unity를 수동으로 활성화했거나, 유효한 라이센스 파일이 이미 존재해야 합니다."
          }
          
          # 라이센스 상태 확인 (간단한 테스트)
          Write-Host "`n라이센스 상태를 확인합니다..."
          $testLogFile = Join-Path $PWD.Path "license-test.log"
          
          $process = Start-Process -FilePath $unityPath `
            -ArgumentList "-batchmode", "-nographics", "-quit", "-logFile", $testLogFile `
            -Wait -PassThru -NoNewWindow
          
          # 로그 확인
          if (Test-Path $testLogFile) {
            $logContent = Get-Content $testLogFile -Raw
            
            # 라이센스 오류 확인 (정확한 패턴 매칭)
            if ($logContent -match "No valid Unity Editor license found" -or $logContent -match "Error.*com\.unity\.editor\.headless.*not found") {
              Write-Host "`n=== License Test Log ===`n"
              Get-Content $testLogFile | Select-Object -Last 30
              Write-Warning "Unity 라이센스가 활성화되지 않았습니다."
            } else {
              Write-Host "Unity 라이센스가 정상적으로 확인되었습니다."
            }
          }

      # 7. Unity 라이센스 활성화 (macOS - bash)
      - name: Activate Unity License (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          UNITY_PATH: ${{ vars.UNITY_PATH }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # Unity 설치 경로 찾기
          UNITY_PATH="${UNITY_PATH}"
          UNITY_VERSION="${UNITY_VERSION}"
          
          if [ -z "$UNITY_PATH" ]; then
            # ProjectVersion.txt 버전 우선 사용
            if [ -n "$UNITY_VERSION" ]; then
              VERSIONED_PATH="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
              if [ -f "$VERSIONED_PATH" ]; then
                UNITY_PATH="$VERSIONED_PATH"
              fi
            fi

            # Unity Hub에서 자동 검색
            HUB_PATH="/Applications/Unity/Hub/Editor"
            if [ -z "$UNITY_PATH" ] && [ -d "$HUB_PATH" ]; then
              # 가장 최신 버전 찾기
              UNITY_PATH=$(find "$HUB_PATH" -maxdepth 2 -name "Unity.app" -type d | sort -r | head -n 1)
              if [ -n "$UNITY_PATH" ]; then
                UNITY_PATH="$UNITY_PATH/Contents/MacOS/Unity"
              fi
            fi
            
            # 대체 경로 확인
            if [ -z "$UNITY_PATH" ] || [ ! -f "$UNITY_PATH" ]; then
              ALT_PATHS=(
                "/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
                "/Applications/Unity/Unity.app/Contents/MacOS/Unity"
              )
              for path in "${ALT_PATHS[@]}"; do
                if [ -f "$path" ]; then
                  UNITY_PATH="$path"
                  break
                fi
              done
            fi
          fi
          
          if [ -z "$UNITY_PATH" ] || [ ! -f "$UNITY_PATH" ]; then
            echo "Unity를 찾을 수 없습니다. UNITY_PATH 환경변수를 설정하거나 Unity를 설치해주세요."
            exit 1
          fi
          
          echo "Unity 경로: $UNITY_PATH"
          echo "UNITY_PATH=$UNITY_PATH" >> "$GITHUB_ENV"

          has_license_error() {
            local log_file="$1"
            [ -f "$log_file" ] && grep -Eiq "No valid Unity Editor license found|Unity Editor requires a valid license|No license file was found|LICENSE SYSTEM.*(Error|failed)|Failed to activate|Your serial number is invalid|Entitlement.*not found" "$log_file"
          }

          has_license_success() {
            local log_file="$1"
            [ -f "$log_file" ] && grep -Eiq "Product: Unity Personal|License group:|Successfully updated license|Licensing is initialized|Successfully resolved entitlement details" "$log_file"
          }

          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "Unity 라이센스를 EMAIL/PASSWORD로 활성화합니다..."
            LOG_FILE="$PWD/activation.log"
            
            set +e
            "$UNITY_PATH" \
              -batchmode \
              -nographics \
              -quit \
              -projectPath "$GITHUB_WORKSPACE" \
              -username "$UNITY_EMAIL" \
              -password "$UNITY_PASSWORD" \
              -logFile "$LOG_FILE"
            
            ACTIVATION_EXIT_CODE=$?
            set -e
            
            # 로그 출력
            echo ""
            echo "=== Unity Activation Log ==="
            if [ -f "$LOG_FILE" ]; then
              tail -n 120 "$LOG_FILE"
            else
              echo "activation.log 파일이 생성되지 않았습니다."
            fi
            echo ""
            
            if [ $ACTIVATION_EXIT_CODE -eq 0 ] || has_license_success "$LOG_FILE"; then
              echo "Unity 라이센스가 성공적으로 활성화되었습니다."
            else
              echo "Unity 라이센스 활성화 명령이 실패했습니다 (Exit Code: $ACTIVATION_EXIT_CODE)."
              echo "라이센스 상태를 확인합니다..."
            fi
          else
            echo "UNITY_EMAIL 또는 UNITY_PASSWORD 시크릿이 설정되지 않았습니다. 기존 라이센스를 사용합니다."
            echo "Self-hosted runner에서 Unity를 수동으로 활성화했거나, 유효한 라이센스 파일이 이미 존재해야 합니다."
          fi
          
          # 라이센스 상태 확인 (간단한 테스트)
          echo ""
          echo "라이센스 상태를 확인합니다..."
          TEST_LOG_FILE="$PWD/license-test.log"
          
          set +e
          # -projectPath가 없으면 Unity가 마지막으로 열었던 프로젝트를 다시 열려고 합니다.
          # Self-hosted runner의 데스크톱 Unity와 충돌하지 않도록 체크아웃한 작업공간을 명시합니다.
          "$UNITY_PATH" -batchmode -nographics -quit -projectPath "$GITHUB_WORKSPACE" -logFile "$TEST_LOG_FILE"
          TEST_EXIT_CODE=$?
          set -e
          
          # 로그 확인
          if [ -f "$TEST_LOG_FILE" ]; then
            if has_license_success "$TEST_LOG_FILE"; then
              echo "Unity 라이센스가 정상적으로 확인되었습니다."
              if [ $TEST_EXIT_CODE -ne 0 ]; then
                echo "Unity가 라이센스 확인 후 Exit Code $TEST_EXIT_CODE 로 종료했지만, 라이센스는 정상입니다. 이후 빌드 단계에서 실제 프로젝트 오류를 확인합니다."
              fi
            elif has_license_error "$TEST_LOG_FILE"; then
              echo ""
              echo "=== License Test Log ==="
              echo ""
              tail -n 120 "$TEST_LOG_FILE"
              echo "Unity 라이센스가 활성화되지 않았습니다."
              echo "UNITY_EMAIL/UNITY_PASSWORD 시크릿 값, Unity 계정 비밀번호 로그인 가능 여부, 2FA 설정을 확인해주세요."
              exit 1
            elif [ $TEST_EXIT_CODE -ne 0 ]; then
              echo ""
              echo "=== License Test Log ==="
              echo ""
              tail -n 120 "$TEST_LOG_FILE"
              echo "Unity 라이센스 성공 여부를 확인할 수 없고 Unity가 Exit Code $TEST_EXIT_CODE 로 종료했습니다."
              exit $TEST_EXIT_CODE
            else
              echo "Unity 라이센스가 정상적으로 확인되었습니다."
            fi
          else
            echo "license-test.log 파일이 생성되지 않았습니다. Unity 실행 또는 권한 문제를 확인해주세요."
            exit 1
          fi

      # 8. 배포 전 Unity 테스트 (macOS)
      - name: Run Unity tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/unity/test-results artifacts/unity/logs

          run_unity_test() {
            mode="$1"
            slug="$2"
            result_file="$PWD/artifacts/unity/test-results/$slug.xml"
            log_file="$PWD/artifacts/unity/logs/$slug.log"

            set +e
            "$UNITY_PATH" -batchmode -nographics -quit \
              -projectPath "$GITHUB_WORKSPACE" \
              -runTests -testPlatform "$mode" \
              -testResults "$result_file" \
              -logFile "$log_file"
            exit_code=$?
            set -e

            if [ "$exit_code" -ne 0 ]; then
              [ -f "$log_file" ] && tail -n 160 "$log_file"
              echo "$mode tests failed with exit code $exit_code."
              exit "$exit_code"
            fi
            if [ ! -s "$result_file" ]; then
              echo "$mode result XML was not created."
              exit 1
            fi
            if ! grep -Eq '(testcasecount|total)="[1-9][0-9]*"' "$result_file"; then
              echo "$mode did not execute any tests."
              exit 1
            fi
          }

          run_unity_test EditMode editmode
          run_unity_test PlayMode playmode

      - name: Upload Unity test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-unity-diagnostics
          path: |
            artifacts/unity
            activation.log
            license-test.log
          if-no-files-found: warn

      # 9. Unity 빌드 실행 (Windows - PowerShell)
      - name: Build Unity WebGL (Windows)
        if: runner.os == 'Windows'
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          UNITY_PATH: ${{ vars.UNITY_PATH }}
        run: |
          # Unity 설치 경로 찾기
          $unityPath = $env:UNITY_PATH
          $unityVersion = $env:UNITY_VERSION
          
          if (-not $unityPath) {
            # ProjectVersion.txt 버전 우선 사용
            if ($unityVersion) {
              $versionedPath = "C:\Program Files\Unity\Hub\Editor\$unityVersion\Editor\Unity.exe"
              if (Test-Path $versionedPath) {
                $unityPath = $versionedPath
              }
            }

            # Unity Hub에서 자동 검색
            $hubPath = "C:\Program Files\Unity\Hub\Editor"
            if ((-not $unityPath) -and (Test-Path $hubPath)) {
              $unityPath = Get-ChildItem -Path $hubPath -Directory | 
                           Where-Object { $_.Name -match "^\d+\.\d+\.\d+f\d+" } | 
                           Sort-Object Name -Descending | 
                           Select-Object -First 1 | 
                           ForEach-Object { Join-Path $_.FullName "Editor\Unity.exe" }
            }
            
            # 대체 경로 확인
            if (-not $unityPath -or -not (Test-Path $unityPath)) {
              $altPaths = @(
                "D:\UnityEditor\$unityVersion\Editor\Unity.exe",
                "D:\Program Files\Unity\Hub\Editor\*\Editor\Unity.exe",
                "C:\Program Files\Unity\Editor\Unity.exe"
              )
              foreach ($path in $altPaths) {
                if ($path -like "*\*\*") {
                  $found = Get-ChildItem -Path $path -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($found) {
                    $unityPath = $found.FullName
                    break
                  }
                } elseif (Test-Path $path) {
                  $unityPath = $path
                  break
                }
              }
            }
          }
          
          if (-not $unityPath -or -not (Test-Path $unityPath)) {
            Write-Error "Unity를 찾을 수 없습니다. UNITY_PATH 환경변수를 설정하거나 Unity를 설치해주세요."
            exit 1
          }
          
          Write-Host "Unity 경로: $unityPath"
          
          # Unity 빌드 실행
          $projectPath = $PWD.Path
          $logFile = Join-Path $projectPath "build.log"
          
          # Start-Process를 사용하여 프로세스를 실행하고 종료 코드를 캡처
          # 참고: -batchmode와 -nographics는 앞쪽에 배치하여 Unity가 올바르게 batch mode로 실행되도록 합니다
          $process = Start-Process -FilePath $unityPath `
            -ArgumentList "-batchmode", "-nographics", "-quit", "-projectPath", $projectPath, "-buildTarget", "WebGL", "-executeMethod", "BuildScript.BuildWebGL", "-logFile", $logFile `
            -Wait -PassThru -NoNewWindow
          
          $exitCode = $process.ExitCode
          
          # 로그 출력
          if (Test-Path $logFile) {
            Write-Host "`n=== Unity Build Log ===`n"
            Get-Content $logFile | Select-Object -Last 100
          }
          
          # 빌드 결과 확인
          if ($exitCode -ne 0) {
            Write-Error "Unity 빌드 실패 (Exit Code: $exitCode)"
            exit $exitCode
          }
          
          Write-Host "Unity 빌드 성공!"

      # 10. Unity 빌드 실행 (macOS - bash)
      - name: Build Unity WebGL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          UNITY_PATH: ${{ vars.UNITY_PATH }}
        run: |
          # Unity 설치 경로 찾기
          UNITY_PATH="${UNITY_PATH}"
          UNITY_VERSION="${UNITY_VERSION}"
          
          if [ -z "$UNITY_PATH" ]; then
            # ProjectVersion.txt 버전 우선 사용
            if [ -n "$UNITY_VERSION" ]; then
              VERSIONED_PATH="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
              if [ -f "$VERSIONED_PATH" ]; then
                UNITY_PATH="$VERSIONED_PATH"
              fi
            fi

            # Unity Hub에서 자동 검색
            HUB_PATH="/Applications/Unity/Hub/Editor"
            if [ -z "$UNITY_PATH" ] && [ -d "$HUB_PATH" ]; then
              # 가장 최신 버전 찾기
              UNITY_PATH=$(find "$HUB_PATH" -maxdepth 2 -name "Unity.app" -type d | sort -r | head -n 1)
              if [ -n "$UNITY_PATH" ]; then
                UNITY_PATH="$UNITY_PATH/Contents/MacOS/Unity"
              fi
            fi
            
            # 대체 경로 확인
            if [ -z "$UNITY_PATH" ] || [ ! -f "$UNITY_PATH" ]; then
              ALT_PATHS=(
                "/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
                "/Applications/Unity/Unity.app/Contents/MacOS/Unity"
              )
              for path in "${ALT_PATHS[@]}"; do
                if [ -f "$path" ]; then
                  UNITY_PATH="$path"
                  break
                fi
              done
            fi
          fi
          
          if [ -z "$UNITY_PATH" ] || [ ! -f "$UNITY_PATH" ]; then
            echo "Unity를 찾을 수 없습니다. UNITY_PATH 환경변수를 설정하거나 Unity를 설치해주세요."
            exit 1
          fi
          
          echo "Unity 경로: $UNITY_PATH"
          
          # Unity 빌드 실행
          PROJECT_PATH="$PWD"
          LOG_FILE="$PROJECT_PATH/build.log"
          
          # Unity 빌드 명령 실행
          "$UNITY_PATH" -batchmode -nographics -quit -projectPath "$PROJECT_PATH" -buildTarget WebGL -executeMethod BuildScript.BuildWebGL -logFile "$LOG_FILE" || EXIT_CODE=$?
          EXIT_CODE=${EXIT_CODE:-0}
          
          # 로그 출력
          if [ -f "$LOG_FILE" ]; then
            echo ""
            echo "=== Unity Build Log ==="
            echo ""
            tail -n 100 "$LOG_FILE"
          fi
          
          # 빌드 결과 확인
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Unity 빌드 실패 (Exit Code: $EXIT_CODE)"
            exit $EXIT_CODE
          fi
          if [ ! -f "$PROJECT_PATH/build/webgl/index.html" ]; then
            echo "WebGL index.html이 생성되지 않았습니다."
            exit 1
          fi
          
          echo "Unity 빌드 성공!"

      # 10. Gzip 압축 파일 해제 (Windows - PowerShell)
      - name: Decompress build files (Windows)
        if: runner.os == 'Windows'
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $buildDir = "build\webgl\Build"
          if (Test-Path $buildDir) {
            Get-ChildItem -Path $buildDir -Filter *.gz | ForEach-Object {
              $outFile = $_.FullName -replace '\.gz$', ''
              Write-Host "Decompressing: $($_.Name)"
              
              # PowerShell을 사용한 Gzip 압축 해제 (리소스 자동 정리)
              try {
                $input = New-Object System.IO.FileStream $_.FullName, ([IO.FileMode]::Open), ([IO.FileAccess]::Read), ([IO.FileShare]::Read)
                try {
                  $output = New-Object System.IO.FileStream $outFile, ([IO.FileMode]::Create), ([IO.FileAccess]::Write), ([IO.FileShare]::None)
                  try {
                    $gzipStream = New-Object System.IO.Compression.GzipStream $input, ([IO.Compression.CompressionMode]::Decompress)
                    try {
                      $buffer = New-Object byte[](1024)
                      while ($true) {
                        $read = $gzipStream.Read($buffer, 0, 1024)
                        if ($read -le 0) { break }
                        $output.Write($buffer, 0, $read)
                      }
                    } finally {
                      $gzipStream.Close()
                    }
                  } finally {
                    $output.Close()
                  }
                } finally {
                  $input.Close()
                }
                Write-Host "Decompressed: $($_.Name)"
              } catch {
                Write-Error "압축 해제 실패: $($_.Name) - $_"
              }
            }
            
            # index.html에서 .gz 확장자 제거
            $indexFile = "build\webgl\index.html"
            if (Test-Path $indexFile) {
              (Get-Content $indexFile) -replace '\.gz"', '"' | Set-Content $indexFile
              Write-Host "Updated index.html to reference decompressed files"
            }
          }

      # 11. Gzip 압축 파일 해제 (macOS - bash)
      - name: Decompress build files (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUILD_DIR="build/webgl/Build"
          if [ -d "$BUILD_DIR" ]; then
            for gz_file in "$BUILD_DIR"/*.gz; do
              if [ -f "$gz_file" ]; then
                echo "Decompressing: $(basename "$gz_file")"
                gunzip -k "$gz_file"
              fi
            done
            
            # index.html에서 .gz 확장자 제거
            INDEX_FILE="build/webgl/index.html"
            if [ -f "$INDEX_FILE" ]; then
              sed -i.bak 's/\.gz"/"/g' "$INDEX_FILE"
              rm -f "$INDEX_FILE.bak"
              echo "Updated index.html to reference decompressed files"
            fi
          fi

      # 12. 빌드 결과물을 아티팩트로 업로드
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-webgl-build
          path: build/webgl
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 빌드 아티팩트 다운로드
      - name: Download build artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: unity-webgl-build
          path: build

      # 2. GitHub Pages 설정
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 3. 빌드 디렉토리를 아티팩트로 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      # 4. GitHub Pages에 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
